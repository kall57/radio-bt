; Radio BT — passerelle webradio Wi-Fi -> enceinte Bluetooth (ESP32-CAM AI Thinker)
;
; Deux firmwares :
;   esp32cam : la radio (environnement par défaut, bouton Upload habituel)
;   updater  : le module de mise à jour par Wi-Fi, ~1 Mo, à installer depuis
;              l'interface web (Réglages > Mise à jour). Ne pas le téléverser par USB.
;
; Plateforme pioarduino : Arduino-ESP32 3.x (la plateforme officielle
; espressif32 de PlatformIO reste bloquée sur Arduino 2.x).

[platformio]
default_envs = esp32cam

[common]
; Version figée sur 55.03.32 = Arduino-ESP32 3.3.2.
; NE PAS passer à "stable" : à partir d'Arduino 3.3.x récents (ex. 3.3.12), le cœur
; occupe plus d'IRAM et l'édition de liens échoue avec Wi-Fi + Bluetooth Classic
; ("region `iram0_0_seg' overflowed").
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
board = esp32cam
framework = arduino

; app0 = radio (2,56 Mo), app1 = module de mise à jour (1,06 Mo), LittleFS 320 Ko
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Indispensable avec la carte ESP32-CAM-MB (et beaucoup d'adaptateurs) : sinon,
; à l'ouverture du moniteur, DTR/RTS maintiennent l'ESP32 en reset -> écran vide.
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800

[env:esp32cam]
extends = common
build_src_filter = +<*> -<updater/>

; (BOARD_HAS_PSRAM et le correctif PSRAM sont déjà fournis par la carte esp32cam)
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DFW_VERSION=\"1.6.0\"
  ; Réseau Wi-Fi par défaut (facultatif : sinon configurez-le depuis le portail "RadioBT-Config")
  ; -DWIFI_DEFAULT_SSID=\"MonWifi\"
  ; -DWIFI_DEFAULT_PASS=\"MonMotDePasse\"

; Versions figées sur celles avec lesquelles le projet a été compilé
lib_deps =
  https://github.com/pschatzmann/ESP32-A2DP.git#a9e946a078f9bc5334038cbf90a7237e9e726cd2
  https://github.com/pschatzmann/arduino-audio-tools.git#ba885d093a14e3f6b71044bbfe6ba0ef0a15f767
  https://github.com/pschatzmann/codec-helix.git#f6e55a307c7577c5e3dfe1bf424a61075235fa08
  bblanchon/ArduinoJson@^7.4.2

; Compresse web/index.html en en-tête C (src/web_index.h) avant chaque compilation
extra_scripts = pre:scripts/embed_web.py

[env:updater]
; Module de mise à jour : compiler avec  pio run -e updater
; puis envoyer .pio/build/updater/firmware.bin depuis l'interface web.
extends = common
build_src_filter = -<*> +<updater/>
lib_deps =
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DUPDATER_VERSION=\"1.0.0\"
; Sécurité : un téléversement USB de ce module écraserait la radio
upload_protocol = custom
upload_command = echo "Le module de mise a jour s'installe depuis l'interface web (Reglages > Mise a jour)." && exit 1
